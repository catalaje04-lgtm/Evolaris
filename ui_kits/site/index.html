<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Evolaris</title>
<link rel="stylesheet" href="../../styles.css">
<meta name="ext-resource-dependency" content="../../assets/logo/logo-color.svg" data-resource-id="logoColor" />
<meta name="ext-resource-dependency" content="../../assets/logo/logo-white.svg" data-resource-id="logoWhite" />
<meta name="ext-resource-dependency" content="../../assets/icons/social/instagram.svg" data-resource-id="socialInstagram" />
<meta name="ext-resource-dependency" content="../../assets/icons/social/facebook.svg" data-resource-id="socialFacebook" />
<meta name="ext-resource-dependency" content="../../assets/icons/social/whatsapp.svg" data-resource-id="socialWhatsapp" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page)}a{color:var(--color-primary-active)}a:hover{color:var(--color-primary)}</style>
</head><body>
<template id="__bundler_thumbnail" data-bg-color="#0D0D0D">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0D0D0D"/>
    <rect x="360" y="300" width="480" height="80" rx="40" fill="#00C100"/>
    <rect x="360" y="420" width="300" height="80" rx="40" fill="#3D3D3D"/>
  </svg>
</template>
<div id="root"></div>
<script src="./image-slot.js"></script>
<script src="./anchors.js"></script>
<script>
  // WhatsApp: número y helper compartidos por Header, Footer y ContactForm.
  window.WHATSAPP_NUMBER = "5492995559999"; // +54 9 299 555 9999
  window.WHATSAPP_GENERIC_TEXT = "Hola! Quiero saber más sobre...";
  window.buildWhatsAppLink = function (text) {
    var base = "https://wa.me/" + window.WHATSAPP_NUMBER;
    return text ? base + "?text=" + encodeURIComponent(text) : base;
  };
</script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="SectionHero.jsx"></script>
<script type="text/babel" src="SectionIntro.jsx"></script>
<script type="text/babel" src="ContactForm.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Products.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel">
// Look final elegido durante el diseño (clima "sobrio", densidad "editorial", acento verde de marca).
// El panel de tweaks para explorar variantes se sacó del sitio final; estos valores quedan fijos.
function App(){
  const [page,setPage]=React.useState("inicio");
  const go = (section, link) => {
    setPage(section);
    window.scrollToAnchor(link ? window.slugify(link) : null);
  };
  const Page = page==="servicios"?Services:page==="productos"?Products:page==="nosotros"?About:Home;
  const vars = {
    "--color-primary": "#00C100",
    "--color-primary-hover": "#10AE09",
    "--color-primary-active": "#1D7714",
    "--color-primary-tint-100": "#EFFAEB",
    "--hero-veil": "linear-gradient(to top, rgba(13,13,13,0.72) 0%, rgba(13,13,13,0.5) 55%, rgba(13,13,13,0.1) 100%)",
    "--hero-scale": 1,
    "--rhythm": 1.34,
  };
  return (<div style={vars}>
    <Header page={page} onNavigate={go}/>
    <Page onNavigate={go}/>
    <Footer onNavigate={go}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
